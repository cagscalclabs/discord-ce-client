name: CodeQL SAST

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          # Analyze only the host-compilable source; the CE-specific
          # headers and lwIP-CE are not available on the runner.
          build-mode: manual

      - name: Build for analysis
        run: |
          clang -std=c11 -Wall -Wextra \
            -DDISCORD_TEST \
            -Itests \
            -c src/main.c -o /tmp/main.o
          clang -std=c11 -Wall -Wextra \
            -c src/wire.c -o /tmp/wire.o

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: c-cpp
